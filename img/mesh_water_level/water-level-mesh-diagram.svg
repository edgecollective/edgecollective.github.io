<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1660 1060" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" font-family="'DejaVu Sans', Verdana, Helvetica, Arial, sans-serif" font-size="22" fill="#000">
  <title>Water level node on a LoRa mesh, with internet and grid-down paths to readers</title>
  <rect width="1660" height="1060" fill="#FFFFFF"/>

  <!-- Local mesh boundary -->
  <rect x="612" y="246" width="1028" height="760" rx="24" fill="none" stroke="#000" stroke-width="2" stroke-dasharray="4 8"/>
  <text x="1620" y="284" font-size="20" font-weight="bold" letter-spacing="1" text-anchor="end">LOCAL MESH</text>
  <text x="1620" y="310" font-size="17" text-anchor="end">solar + batteries</text>
  <text x="1620" y="332" font-size="17" text-anchor="end">works with grid and internet down</text>

  <!-- Internet database cloud -->
  <path d="M420 200 A40 40 0 0 1 440 140 A50 50 0 0 1 520 120 A45 45 0 0 1 595 130 A40 40 0 0 1 630 190 A35 35 0 0 1 595 235 L455 235 A35 35 0 0 1 420 200 Z" fill="#FFF" stroke="#000" stroke-width="3"/>
  <text x="525" y="175" text-anchor="middle">Internet</text>
  <text x="525" y="205" text-anchor="middle">database</text>

  <!-- Cell tower -->
  <g stroke="#000" stroke-width="5" fill="none" stroke-linecap="round">
    <line x1="170" y1="250" x2="145" y2="370"/>
    <line x1="170" y1="250" x2="195" y2="370"/>
    <line x1="160" y1="290" x2="181" y2="315"/>
    <line x1="181" y1="290" x2="160" y2="315"/>
    <line x1="155" y1="320" x2="188" y2="350"/>
    <line x1="186" y1="320" x2="152" y2="350"/>
    <line x1="132" y1="372" x2="208" y2="372"/>
    <path d="M150 222 A26 26 0 0 0 150 258" stroke-width="3"/>
    <path d="M140 212 A40 40 0 0 0 140 268" stroke-width="3"/>
    <path d="M190 222 A26 26 0 0 1 190 258" stroke-width="3"/>
    <path d="M200 212 A40 40 0 0 1 200 268" stroke-width="3"/>
  </g>
  <circle cx="170" cy="240" r="9" fill="#000"/>
  <text x="100" y="300" text-anchor="end">Cell</text>
  <text x="100" y="328" text-anchor="end">Tower</text>

  <!-- Internet links (thin solid) -->
  <g stroke="#000" stroke-width="2">
    <line x1="222" y1="262" x2="418" y2="205"/>
    <line x1="170" y1="390" x2="165" y2="552"/>
    <line x1="470" y1="244" x2="402" y2="572"/>
    <line x1="602" y1="244" x2="668" y2="460"/>
  </g>
  <text x="418" y="420" text-anchor="end">Internet</text>
  <text x="546" y="350" text-anchor="middle">Wi-Fi</text>
  <text x="546" y="378" text-anchor="middle">uplink</text>

  <!-- Phone (anywhere) -->
  <rect x="130" y="560" width="72" height="112" rx="8" fill="#FFF" stroke="#000" stroke-width="3"/>
  <text x="166" y="622" text-anchor="middle" font-size="18">Phone</text>
  <text x="166" y="708" text-anchor="middle">(anywhere)</text>

  <!-- Laptop -->
  <rect x="330" y="580" width="140" height="90" fill="#FFF" stroke="#000" stroke-width="3"/>
  <text x="400" y="632" text-anchor="middle">Laptop</text>
  <text x="400" y="708" text-anchor="middle">(at home)</text>

  <!-- Gateway node -->
  <line x1="775" y1="410" x2="775" y2="470" stroke="#000" stroke-width="8"/>
  <rect x="640" y="470" width="150" height="82" fill="#FFF" stroke="#000" stroke-width="3"/>
  <text x="712" y="504" text-anchor="middle">Gateway</text>
  <text x="712" y="534" text-anchor="middle">Node</text>
  <text x="715" y="584" text-anchor="middle" font-size="18">(at home)</text>

  <!-- Mesh repeater on a pole -->
  <line x1="1115" y1="270" x2="1115" y2="330" stroke="#000" stroke-width="8"/>
  <rect x="980" y="330" width="150" height="82" fill="#FFF" stroke="#000" stroke-width="3"/>
  <text x="1052" y="364" text-anchor="middle">Mesh</text>
  <text x="1052" y="394" text-anchor="middle">Repeater</text>
  <line x1="1030" y1="412" x2="1030" y2="545" stroke="#000" stroke-width="4"/>
  <line x1="995" y1="545" x2="1065" y2="545" stroke="#000" stroke-width="4"/>
  <polygon points="1050,450 1120,425 1140,480 1070,505" fill="#FFF" stroke="#000" stroke-width="3"/>
  <line x1="1032" y1="470" x2="1056" y2="466" stroke="#000" stroke-width="3"/>
  <text x="1150" y="465" font-size="18">Solar</text>
  <text x="1030" y="575" text-anchor="middle" font-size="18">(hilltop or rooftop)</text>

  <!-- Sensor node -->
  <line x1="1345" y1="500" x2="1345" y2="560" stroke="#000" stroke-width="8"/>
  <rect x="1330" y="560" width="140" height="82" fill="#FFF" stroke="#000" stroke-width="3"/>
  <text x="1400" y="594" text-anchor="middle">Sensor</text>
  <text x="1400" y="624" text-anchor="middle">Node</text>
  <polygon points="1495,520 1565,495 1590,555 1520,580" fill="#FFF" stroke="#000" stroke-width="3"/>
  <line x1="1470" y1="580" x2="1510" y2="566" stroke="#000" stroke-width="3"/>
  <text x="1542" y="545" text-anchor="middle" font-size="16">Solar</text>

  <!-- Depth sensor + tank -->
  <rect x="1386" y="642" width="28" height="118" fill="#FFF" stroke="#000" stroke-width="3"/>
  <text x="1428" y="668" font-size="18">Depth</text>
  <text x="1428" y="690" font-size="18">Sensor</text>
  <rect x="1290" y="702" width="250" height="230" fill="none" stroke="#000" stroke-width="3"/>
  <line x1="1292" y1="790" x2="1538" y2="790" stroke="#000" stroke-width="1.5" stroke-dasharray="10 6"/>
  <text x="1415" y="860" text-anchor="middle">Water Storage</text>

  <!-- Kiosk -->
  <line x1="895" y1="690" x2="895" y2="750" stroke="#000" stroke-width="8"/>
  <rect x="745" y="750" width="165" height="125" fill="#FFF" stroke="#000" stroke-width="3"/>
  <rect x="762" y="767" width="131" height="72" fill="#FFF" stroke="#000" stroke-width="2"/>
  <text x="827" y="800" text-anchor="middle" font-size="16" font-family="'DejaVu Sans Mono', Menlo, monospace">TANK</text>
  <text x="827" y="828" text-anchor="middle" font-size="22" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, monospace">74%</text>
  <text x="827" y="912" text-anchor="middle">Kiosk</text>
  <text x="827" y="940" text-anchor="middle" font-size="18">(e-ink display, solar)</text>

  <!-- Phone + mesh radio in field -->
  <rect x="1020" y="740" width="62" height="100" rx="8" fill="#FFF" stroke="#000" stroke-width="3"/>
  <text x="1051" y="796" text-anchor="middle" font-size="16">Phone</text>
  <line x1="1195" y1="690" x2="1195" y2="760" stroke="#000" stroke-width="8"/>
  <rect x="1120" y="760" width="90" height="58" fill="#FFF" stroke="#000" stroke-width="3"/>
  <text x="1165" y="785" text-anchor="middle" font-size="16">Mesh</text>
  <text x="1165" y="806" text-anchor="middle" font-size="16">Radio</text>
  <line x1="1084" y1="790" x2="1118" y2="790" stroke="#000" stroke-width="2.5" stroke-dasharray="2 5" stroke-linecap="round"/>
  <text x="1115" y="880" text-anchor="middle">Phone + mesh radio</text>
  <text x="1115" y="908" text-anchor="middle" font-size="18">(in field, no cell service)</text>

  <!-- LoRa mesh links (thick dashed) -->
  <g stroke="#000" stroke-width="3.5" stroke-dasharray="14 9" fill="none">
    <line x1="782" y1="405" x2="1108" y2="270"/>
    <line x1="1122" y1="276" x2="1340" y2="496"/>
    <line x1="780" y1="418" x2="890" y2="684"/>
    <line x1="1340" y1="508" x2="1200" y2="684"/>
  </g>
  <text x="930" y="400" text-anchor="middle">LoRa</text>
  <text x="930" y="427" text-anchor="middle">mesh</text>

  <!-- Legend -->
  <g font-size="19">
    <text x="40" y="852" font-weight="bold">Links</text>
    <line x1="40" y1="890" x2="120" y2="890" stroke="#000" stroke-width="2"/>
    <text x="136" y="896">Internet (needs grid + ISP)</text>
    <line x1="40" y1="935" x2="120" y2="935" stroke="#000" stroke-width="3.5" stroke-dasharray="14 9"/>
    <text x="136" y="941">LoRa mesh radio</text>
    <line x1="40" y1="980" x2="120" y2="980" stroke="#000" stroke-width="2.5" stroke-dasharray="2 5" stroke-linecap="round"/>
    <text x="136" y="986">Bluetooth</text>
  </g>
</svg>
